// ---------- translation of labels (Python fills D.tr for lang='hi' or 'te') ----------
const TR = D.tr || {};
const tr = s => (s in TR ? TR[s] : s);

// ---------- a complex matrix (rows of [re, im]) as phase-coloured cells with exact entries ----------
function matGrid(g, x, y, cs, M, o) { o = o || {}; const r = M.length, c = M[0].length, dark = isDark(), bg = rgb(C.panel);
  for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) { const z = M[i][j], m = Math.hypot(z[0], z[1]), a = Math.pow(Math.min(1, m / (o.scale || 1)), 0.6);
    let col = C.panel; if (m > 1e-9) { const p = phaseRGB(Math.atan2(z[1], z[0]), dark); col = `rgb(${Math.round(bg[0] + (p[0] * 255 - bg[0]) * a)},${Math.round(bg[1] + (p[1] * 255 - bg[1]) * a)},${Math.round(bg[2] + (p[2] * 255 - bg[2]) * a)})`; }
    g.fillStyle = col; g.fillRect(x + j * cs + 0.5, y + i * cs + 0.5, cs - 1, cs - 1); g.strokeStyle = C.grid; g.lineWidth = 1; g.strokeRect(x + j * cs + 0.5, y + i * cs + 0.5, cs - 1, cs - 1);
    if (m > 5e-4 && cs >= 30) { const s = cstr(z[0], z[1]).replace(/ /g, ''), cx = x + j * cs + cs / 2, cy = y + i * cs + cs / 2, fs = cs >= 44 ? 12 : 10;
      g.fillStyle = C.ink; g.textAlign = 'center'; g.textBaseline = 'middle';
      if (s.length <= Math.floor(cs / 6.5)) { g.font = fs + 'px system-ui'; g.fillText(s, cx, cy + 1); }
      else { const a = ang(Math.atan2(z[1], z[0])), top = num(m, 2), bot = '∠' + (/π/.test(a) && a.length <= 6 ? a : (Math.atan2(z[1], z[0]) * 180 / PI).toFixed(0) + '°');
        g.font = (fs - 1) + 'px system-ui'; if (Math.max(top.length, bot.length) <= Math.floor(cs / 5.6)) { g.fillText(top, cx, cy - fs * 0.5 + 1); g.fillText(bot, cx, cy + fs * 0.6 + 1); } }
      g.textAlign = 'left'; g.textBaseline = 'alphabetic'; } }
  g.strokeStyle = C.muted; g.lineWidth = 1.2; g.strokeRect(x, y, c * cs, r * cs);
  if (o.label) { g.fillStyle = C.muted; g.font = '12px system-ui'; g.textAlign = 'center'; g.fillText(o.label, x + c * cs / 2, y - 7); g.textAlign = 'left'; }
  if (o.rows) { g.fillStyle = C.muted; g.font = '11px system-ui'; g.textAlign = 'right'; o.rows.forEach((t, i) => g.fillText(t, x - 5, y + i * cs + cs / 2 + 4)); g.textAlign = 'left'; } }
// a note at the foot of a canvas, wrapped to its width
function footnote(g, text, x, W, H) { g.fillStyle = C.muted; g.font = '11px system-ui'; const words = text.split(' '), lines = []; let ln = '';

const cmul2 = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
function matVec(M, v) { return M.map(row => row.reduce((s, z, j) => { const p = cmul2(z, v[j]); return [s[0] + p[0], s[1] + p[1]]; }, [0, 0])); }
function outer(v) { return v.map(a => v.map(b => cmul2(a, [b[0], -b[1]]))); }

// ---------- controls; a key binds a control to the app state (undo, shareable links) ----------
let ST = null; const CTRL = {}; const HIST = []; let histTimer = null, restoring = false;
function useState(obj) { ST = obj; try { const h = decodeURIComponent(location.hash.slice(1)); if (h.startsWith('{')) { const o = JSON.parse(h); for (const k in o) if (k in obj) obj[k] = o[k]; } } catch (e) {} return obj; }
function snapshot() { const o = {}; for (const k in CTRL) o[k] = ST[k]; return o; }
function changed() { if (restoring || !ST) return; clearTimeout(histTimer); histTimer = setTimeout(() => { const s = JSON.stringify(snapshot());
  if (HIST[HIST.length - 1] !== s) HIST.push(s); if (HIST.length > 200) HIST.shift();
  try { history.replaceState(null, '', '#' + encodeURIComponent(s)); } catch (e) {} }, 300); }
function undo() { if (HIST.length < 2) return; HIST.pop(); const o = JSON.parse(HIST[HIST.length - 1]); restoring = true;
  for (const k in o) if (CTRL[k]) CTRL[k].set(o[k]); restoring = false; try { history.replaceState(null, '', '#' + encodeURIComponent(HIST[HIST.length - 1])); } catch (e) {} }
function group(title) { const g = el('div', 'grp'); if (title) g.appendChild(el('h4', '', tr(title))); panel.appendChild(g); return g; }
function slider(parent, label, min, max, step, val, fmt, on, key) { const w = el('label', 'ctl'), top = el('div', 'ctl-top'), out = el('b');
  if (key && ST && key in ST) val = ST[key];
  top.append(el('span', '', tr(label)), out); const inp = el('input'); inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = val;
  const upd = silent => { out.textContent = fmt(+inp.value); if (key && ST) ST[key] = +inp.value; if (!silent) { on(+inp.value); if (key) changed(); } };
  inp.addEventListener('input', () => upd(false)); w.append(top, inp); parent.appendChild(w); upd(true);
  const c = { set(v, silent) { inp.value = v; upd(silent); }, get: () => +inp.value, el: w }; if (key) CTRL[key] = c; return c; }
function buttons(parent, list, on, sel, key) { const w = el('div', 'btns'); if (key && ST && key in ST) sel = ST[key];
  const press = (k, b, silent) => { if (sel !== undefined) bs.forEach(x => x.classList.toggle('on', x === b)); if (key && ST) ST[key] = k; on(k, b); if (key && !silent) changed(); };
  const bs = list.map(([k, lab]) => { const b = el('button', '', tr(lab)); b.type = 'button'; b.dataset.k = k;
    b.onclick = () => press(k, b); if (sel === k) b.classList.add('on'); w.appendChild(b); return b; });
  parent.appendChild(w);
  if (key) CTRL[key] = { set(v) { const b = bs.find(x => x.dataset.k === String(v)); if (b) press(b.dataset.k, b, true); }, get: () => ST[key] };
  return bs; }
function check(parent, label, val, on, key) { const w = el('label', 'chk'), i = el('input'); i.type = 'checkbox'; if (key && ST && key in ST) val = ST[key]; i.checked = !!val;
  i.onchange = () => { if (key && ST) ST[key] = i.checked; on(i.checked); if (key) changed(); }; w.append(i, el('span', '', tr(label))); parent.appendChild(w);
  if (key) CTRL[key] = { set(v) { i.checked = !!v; ST[key] = !!v; on(!!v); }, get: () => i.checked }; return i; }
function readout(parent) { const r = el('div', 'read'); parent.appendChild(r); return r; }

// ---------- toolbar: theme, undo, share link, picture, video ----------
const ICON_THEME = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>';
function composite(scale) { // every visible canvas in the stage, laid out as on screen, onto one canvas
  const sr = stage.getBoundingClientRect(), dpr = scale || Math.min(2, window.devicePixelRatio || 1), pad = 16, head = 34;
  const out = document.createElement('canvas'); out.width = Math.round((sr.width + 2 * pad) * dpr); out.height = Math.round((sr.height + 2 * pad + head) * dpr);
  const g = out.getContext('2d'); g.scale(dpr, dpr); g.fillStyle = C.bg; g.fillRect(0, 0, out.width, out.height);
  g.fillStyle = C.ink; g.font = '600 17px system-ui,sans-serif'; g.fillText(T.title, pad, pad + 16);
  stage.querySelectorAll('.box').forEach(bx => { const r = bx.getBoundingClientRect(); if (!r.width || bx.offsetParent === null) return;
    const x = r.left - sr.left + pad, y = r.top - sr.top + pad + head; g.fillStyle = C.panel; g.strokeStyle = C.edge; g.lineWidth = 1; g.beginPath(); g.rect(x, y, r.width, r.height); g.fill(); g.stroke();
    const cap = bx.querySelector('.cap'); if (cap) { g.fillStyle = C.muted; g.font = '12px system-ui,sans-serif'; g.fillText(cap.textContent, x + 10, y + 18); }
    bx.querySelectorAll('canvas').forEach(cv => { const c = cv.getBoundingClientRect(); if (!c.width) return; try { g.drawImage(cv, c.left - sr.left + pad, c.top - sr.top + pad + head, c.width, c.height); } catch (e) {} }); });
  g.fillStyle = C.muted; g.font = '11px system-ui,sans-serif'; g.fillText(D.meta, pad, out.height / dpr - 6); return out; }
function download(href, name) { const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
let REC = null;
function toolbar() {
  const bar = el('div', 'tools'); $('try').after(bar);
  const mk = (html, title, fn) => { const b = el('button', 'tool'); b.type = 'button'; b.innerHTML = html; b.title = tr(title); b.onclick = fn; bar.appendChild(b); return b; };
  mk(ICON_THEME + ' ' + tr('light / dark'), 'light / dark', () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; readColors(); if (X && X.recolor) X.recolor(); });
  if (Object.keys(CTRL).length) { mk('↶ ' + tr('undo'), 'undo', undo);
    const lk = mk('🔗 ' + tr('copy link'), 'copy a link to exactly this set-up', () => { const s = JSON.stringify(snapshot()); const url = location.href.split('#')[0] + '#' + encodeURIComponent(s);
      try { history.replaceState(null, '', url); } catch (e) {} const done = () => { lk.innerHTML = '✓ ' + tr('link copied'); setTimeout(() => lk.innerHTML = '🔗 ' + tr('copy link'), 1600); };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, done); else done(); }); }
  mk('⤓ ' + tr('picture'), 'save the views as a PNG picture', () => download(composite(2).toDataURL('image/png'), D.topic + '.png'));
  if (window.MediaRecorder && HTMLCanvasElement.prototype.captureStream) {
    const rb = mk('● ' + tr('record video'), 'record the views as a WebM video', () => {
      if (REC) { REC.stop(); return; }
      const cv = composite(1), stream = cv.captureStream(30), chunks = []; let mr;
      try { mr = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm' }); } catch (e) { return; }
      mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      mr.onstop = () => { REC = null; rb.innerHTML = '● ' + tr('record video'); rb.classList.remove('on'); download(URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })), D.topic + '.webm'); };
      REC = { stop: () => mr.stop(), canvas: cv, until: performance.now() + 20000 }; mr.start(200); rb.innerHTML = '■ ' + tr('stop recording'); rb.classList.add('on'); });
  }
  if (ST) HIST.push(JSON.stringify(snapshot()));
}
function recordFrame() { if (!REC) return; const fresh = composite(1), g = REC.canvas.getContext('2d'); g.drawImage(fresh, 0, 0, REC.canvas.width, REC.canvas.height); if (performance.now() > REC.until) REC.stop(); }


function App() {
  const st = useState({ z: I.z || [2, 1], w: I.w || [0, 1], op: 'mul', n: 5, snap: true });
  CTRL.z = { set(v) { st.z = v.slice(); }, get: () => st.z }; CTRL.w = { set(v) { st.w = v.slice(); }, get: () => st.w };
  const cv = box(stage, 'Drag z (blue) and w (orange)', 'tall', T.hint2d);
  cv.style.height = 'min(70vh,560px)';
  const P = Plane(cv, 4.2);
  const sn = v => st.snap ? Math.round(v * 4) / 4 : v;
  P.handles.push({ get: () => st.z, set: (x, y) => { st.z = [clamp(sn(x), -6, 6), clamp(sn(y), -6, 6)]; changed(); } });
  P.handles.push({ get: () => st.w, set: (x, y) => { st.w = [clamp(sn(x), -6, 6), clamp(sn(y), -6, 6)]; changed(); } });
  const g = group('Operation');
  const nS = { el: null };
  buttons(g, [['add', 'z + w'], ['sub', 'z − w'], ['mul', 'z · w'], ['div', 'z / w'], ['conj', 'z̄'], ['pow', 'zⁿ']], k => { st.op = k; nS.el.style.display = k === 'pow' ? '' : 'none'; }, st.op, 'op');
  const ns = slider(g, 'n', 2, 12, 1, st.n, v => String(v), v => st.n = v, 'n'); nS.el = ns.el; ns.el.style.display = st.op === 'pow' ? '' : 'none';
  check(g, 'snap to quarter steps', st.snap, v => st.snap = v, 'snap');
  buttons(g, [['u', 'w on the unit circle'], ['i', 'w = i']], k => { if (k === 'i') st.w = [0, 1]; else { const a = Math.atan2(st.w[1], st.w[0]); st.w = [Math.cos(a), Math.sin(a)]; } changed(); });
  const R = readout(group('Values'));
  const mul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
  const div = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return d < 1e-12 ? [NaN, NaN] : [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
  this.frame = function () {
    const z = st.z, w = st.w; let r, label;
    if (st.op === 'add') { r = [z[0] + w[0], z[1] + w[1]]; label = 'z + w'; }
    if (st.op === 'sub') { r = [z[0] - w[0], z[1] - w[1]]; label = 'z − w'; }
    if (st.op === 'mul') { r = mul(z, w); label = 'z·w'; }
    if (st.op === 'div') { r = div(z, w); label = 'z/w'; }
    if (st.op === 'conj') { r = [z[0], -z[1]]; label = 'z̄'; }
    let pw = []; if (st.op === 'pow') { let c = [1, 0]; pw.push(c); for (let k = 1; k <= st.n; k++) { c = mul(c, z); pw.push(c); } r = c; label = 'zⁿ'; }
    const ext = Math.max(4.2, ...[z, w, r].filter(q => isFinite(q[0])).map(q => Math.max(Math.abs(q[0]), Math.abs(q[1])) * 1.15));
    P.range = st.op === 'pow' ? Math.min(Math.max(4.2, ...pw.map(q => Math.hypot(q[0], q[1]) * 1.1)), 400) : Math.min(ext, 40);
    P.begin(); P.axes(P.range > 12 ? Math.pow(10, Math.floor(Math.log10(P.range / 2))) : (P.range > 6 ? 2 : 1), 'i');
    const uc = []; for (let i = 0; i <= 96; i++) { const a = i / 96 * TAU; uc.push([Math.cos(a), Math.sin(a)]); } P.poly(uc, A(C.muted, 0.6), 1, null, [4, 4]);
    const az = Math.atan2(z[1], z[0]), aw = Math.atan2(w[1], w[0]);
    if (st.op === 'add') { P.line(z[0], z[1], r[0], r[1], A(C.c2, 0.7), 1.4, [5, 4]); P.line(w[0], w[1], r[0], r[1], A(C.c1, 0.7), 1.4, [5, 4]); }
    if (st.op === 'sub') { P.arrow(w[0], w[1], z[0], z[1], A(C.c3, 0.5), 1.6); P.line(0, 0, -w[0], -w[1], A(C.c2, 0.5), 1.2, [4, 4]); }
    if (st.op === 'mul' || st.op === 'div') { const s = st.op === 'mul' ? 1 : -1, ar = Math.atan2(r[1], r[0]);
      const pos = a => (a + TAU) % TAU; P.arc(0.55 * P.range / 4.2, 0, pos(az), A(C.c1, 0.9), 2); P.arc(0.8 * P.range / 4.2, 0, pos(aw), A(C.c2, 0.9), 2);
      if (isFinite(ar)) P.arc(1.05 * P.range / 4.2, 0, pos(ar), A(C.c3, 0.9), 2);
      const m = Math.hypot(r[0], r[1]); if (isFinite(m)) { const cc = []; for (let i = 0; i <= 96; i++) { const a = i / 96 * TAU; cc.push([m * Math.cos(a), m * Math.sin(a)]); } P.poly(cc, A(C.c3, 0.3), 1); } }
    if (st.op === 'conj') { P.line(z[0], z[1], r[0], r[1], A(C.c3, 0.7), 1.4, [5, 4]); }
    if (st.op === 'pow') { P.poly(pw, A(C.c3, 0.6), 1.5); pw.forEach((q, k) => { P.dot(q[0], q[1], 3.5, C.c3); if (k <= 8) P.text(q[0], q[1], k ? 'z' + (k > 1 ? String(k).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]) : '') : '1', C.muted, 6, -6, '11px system-ui'); }); }
    P.arrow(0, 0, z[0], z[1], C.c1); if (st.op !== 'conj' && st.op !== 'pow') P.arrow(0, 0, w[0], w[1], C.c2);
    if (isFinite(r[0])) P.arrow(0, 0, r[0], r[1], C.c3, 3);
    P.dot(z[0], z[1], 7, C.c1, true); if (st.op !== 'conj' && st.op !== 'pow') P.dot(w[0], w[1], 7, C.c2, true);
    P.text(z[0], z[1], 'z', C.c1, 10, -8, 'bold 14px system-ui'); if (st.op !== 'conj' && st.op !== 'pow') P.text(w[0], w[1], 'w', C.c2, 10, -8, 'bold 14px system-ui');
    if (isFinite(r[0])) P.text(r[0], r[1], label, C.c3, 10, 16, 'bold 14px system-ui');
    R.innerHTML = '';
    const tb = el('table', 't'); const rowv = (n, q, col) => { const tr = el('tr'); const m = Math.hypot(q[0], q[1]); const a = Math.atan2(q[1], q[0]);
      const td = x => { const d = el('td', '', x); tr.appendChild(d); return d; }; td(n).style.color = col; td(cstr(q[0], q[1])); td('|·| ' + num(m, 3)); td('arg ' + (m < 1e-9 ? '—' : ang(a))); tb.appendChild(tr); };
    rowv('z', z, C.c1); if (st.op !== 'conj' && st.op !== 'pow') rowv('w', w, C.c2); if (isFinite(r[0])) rowv(label, r, C.c3); R.appendChild(tb);
    const why = { add: tr('Add the real parts and the imaginary parts: put w at the tip of z.'), sub: tr('z − w is the arrow from w to z.'),
      mul: `${tr('Lengths multiply')} (${num(Math.hypot(...z), 3)} × ${num(Math.hypot(...w), 3)}) ${tr('and angles add')} (${ang(az)} + ${ang(aw)}).`,
      div: tr('Lengths divide and angles subtract.'), conj: tr('The conjugate mirrors z in the real axis: same length, opposite angle.'),
      pow: tr('zⁿ = rⁿ·e^(inθ): the length is raised to the power n and the angle is multiplied by n (De Moivre).') }[st.op];
    R.appendChild(el('p', 'note', why));
  };
}
let X = null;
X = new App();
toolbar();

let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; try { X.frame(dt); recordFrame(); } catch (e) { console.error(e); throw e; } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__sia_explore = { state: () => X, frame: dt => X.frame(dt || 0.016) };
})();
