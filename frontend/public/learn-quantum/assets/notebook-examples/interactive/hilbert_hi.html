<!doctype html>
<html lang="hi" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>हिल्बर्ट समष्टि: अवस्था पर गेट की क्रिया</title>
<style>
:root{--bg:#fbfcfe;--panel:#ffffff;--ink:#172033;--muted:#5f6b7d;--edge:#d7e0ea;--grid:#e6ecf3;--soft:#eef3f9;
 --c1:#2a78d6;--c2:#e8663d;--c3:#13a37a;--c4:#8b5cf6;--accent:#2a78d6}
[data-theme=dark]{--bg:#0f1520;--panel:#161e2b;--ink:#e6ebf2;--muted:#9aa6b8;--edge:#2a3546;--grid:#1e2838;--soft:#1c2636;
 --c1:#5b9ff0;--c2:#f08a5d;--c3:#3cc996;--c4:#a78bfa;--accent:#6aa8f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Telugu",sans-serif}
main{max-width:1240px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}.intro{margin:0 0 6px;color:var(--ink)}.try{margin:0 0 14px;color:var(--muted);font-size:14px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.box{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px;position:relative;min-width:0}
.box .cap{font-size:12.5px;color:var(--muted);margin:0 0 4px 2px}
.box canvas{display:block;width:100%;height:340px;touch-action:none;cursor:grab}
.box canvas.tall{height:420px}.box canvas.short{height:190px}.box canvas.mat{height:236px}.box canvas.wide{height:220px}
.box .hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none;background:var(--panel);padding:0 4px;border-radius:4px;opacity:.9}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.grp{border-top:1px solid var(--edge);padding-top:10px}.grp:first-child{border-top:0;padding-top:0}
.grp h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.ctl{display:block;margin:4px 0}.ctl-top{display:flex;justify-content:space-between;font-size:13.5px}
.ctl-top b{font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13.5px;padding:6px 10px;border-radius:7px;border:1px solid var(--edge);background:var(--soft);color:var(--ink);cursor:pointer;min-height:34px}
button:hover{border-color:var(--accent)}button.on{background:var(--accent);border-color:var(--accent);color:#fff}
label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:4px 0;cursor:pointer}
.read{font-size:13.5px;font-variant-numeric:tabular-nums;line-height:1.6}
.read .k{color:var(--muted)}.read .big{font-size:15px;font-weight:600}
.note{font-size:13px;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin-top:16px}
.box.dark{background:#0b0f17;border-color:#1f2937}.box.dark .cap{color:#8b97ab}.box.dark .hint{background:#0b0f17;color:#8b97ab}
.dsrow{display:grid;grid-template-columns:minmax(0,3.2fr) minmax(0,1fr);gap:12px}@media (max-width:600px){.dsrow{grid-template-columns:minmax(0,1fr);gap:10px}}
.dsrow canvas{display:block;width:100%;touch-action:none}
.box canvas.circ{height:120px}
.eqtext{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;padding:6px 4px 2px;line-height:1.5;word-break:break-word}
.brow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.bcell{flex:1 1 140px;max-width:240px}.bcell canvas{width:100%;height:230px;display:block;touch-action:none;cursor:grab}
.blab{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.svt{max-height:520px;overflow:auto}table.sv th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:2px 6px}table.sv td{padding:3px 6px;white-space:nowrap}
table.sv .bar{display:inline-block;height:9px;background:var(--c1);border-radius:2px;vertical-align:middle;max-width:70px}table.sv td:nth-child(3){min-width:120px}
@keyframes flash{from{background:rgba(232,102,61,.35)}to{background:transparent}}tr.chg td{animation:flash 1.4s ease-out}
pre.code{font-size:11.5px;background:var(--soft);padding:8px;border-radius:6px;white-space:pre-wrap;word-break:break-all;margin:6px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
button.tool{font-size:12.5px;min-height:30px;padding:4px 10px;display:inline-flex;align-items:center;gap:5px;background:var(--panel)}
table.t{border-collapse:collapse;font-size:13px;width:100%}table.t td{padding:2px 4px;border-bottom:1px solid var(--grid)}
</style></head><body><main>
<h1 id="title"></h1><p class="intro" id="intro"></p><p class="try" id="try"></p>
<div class="wrap"><div class="stage" id="stage"></div><aside class="panel" id="panel"></aside></div>
<div class="foot" id="foot"></div>
</main>

    const groups = {}; for (let i = 0; i < D; i++) { const w = bits(i).split('').filter(c => c === '1').length; (groups[w] = groups[w] || []).push(i); }
    const items = []; for (let i = 0; i < D; i++) { const w = bits(i).split('').filter(c => c === '1').length, th = n ? PI * w / n : 0, grp = groups[w], idx = grp.indexOf(i), phi = grp.length > 1 ? TAU * idx / grp.length + 0.3 : 0;
      const p = [Math.sin(th) * Math.cos(phi), Math.sin(th) * Math.sin(phi), Math.cos(th)], pr = S.R.re[i * D + i], ph = Math.atan2(S.im[i], S.re[i]); items.push({ i, p, pr, ph, d: V.P(p)[2] }); }

    items.sort((a, b) => b.d - a.d).forEach(it => { if (it.pr < 1e-4) { V.dot(it.p, 2, A(C.muted, 0.4)); return; } const [cr, cg, cb] = hueRGB(S.pure ? it.ph : 0); const col = S.pure ? `rgb(${cr * 200 | 0},${cg * 200 | 0},${cb * 200 | 0})` : C.muted;
      V.seg([0, 0, 0], it.p, A(col, 0.7), 1.4); V.dot(it.p, 4 + 16 * Math.sqrt(it.pr), col); V.label(it.p.map(x => x * 1.22), '|' + bits(it.i) + '⟩', C.ink, '11px system-ui'); }); }

  // ---------- tables ----------
  let lastTable = '';
  function drawTables(S, settledNow) { const D = dimOf(), pur = purity(S.R);
    let html = '';
    if (pur < 0.9999) { html = `<p class="note">${tr('The state is mixed (purity tr ρ² =')} ${num(pur, 3)}): ${tr('no single state vector describes it. Probabilities (the diagonal of ρ):')}</p><table class="t sv"><tr><th>${tr('basis')}</th><th>${tr('probability')}</th><th></th></tr>`;
      for (let i = 0; i < D; i++) { const p = S.R.re[i * D + i]; html += `<tr><td>|${bits(i)}⟩</td><td>${num(p, 3)}</td><td><span class="bar" style="width:${(p * 100).toFixed(1)}%"></span></td></tr>`; } html += '</table>'; }
    else { html = `<table class="t sv"><tr><th>${tr('basis')}</th><th>${tr('amplitude')}</th><th>${tr('probability')}</th><th>${tr('phase')}</th></tr>`;
      for (let i = 0; i < D; i++) { const re = S.re[i], im = S.im[i], m = Math.hypot(re, im), p = m * m, cls = settledNow && flashRows.has(i) && performance.now() - flashT < 1400 ? ' class="chg"' : '';
        html += `<tr${cls}><td>|${bits(i)}⟩</td><td>${m < 5e-4 ? '0' : cstr(re, im)}</td><td><span class="bar" style="width:${(p * 100).toFixed(1)}%"></span> ${num(p, 3)}</td><td>${m < 5e-4 ? '—' : ang(Math.atan2(im, re))}</td></tr>`; } html += '</table>'; }
    if (html !== lastTable) { svT.innerHTML = html; lastTable = html; }
    // density matrix
    const s = fit(cvD), g = s.g; let M, Dm, labels;
    if (st.rho === 'full') { M = S.R; Dm = D; labels = [...Array(D).keys()].map(bits); }
    else { const q = +st.rho.slice(1), red = reduced(S.R, q); M = { re: Float64Array.from([red.r00, red.r01r, red.r01r, red.r11]), im: Float64Array.from([0, red.r01i, -red.r01i, 0]) }; Dm = 2; labels = ['0', '1']; }
    const lab = Dm <= 8 ? 44 : 38, cs = Math.max(10, Math.floor(Math.min((s.w - lab - 20) / Dm, Dm <= 4 ? 64 : 400 / Dm))), x0 = lab, y0 = 22;
    g.font = (cs >= 40 ? 12 : 10) + 'px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let i = 0; i < Dm; i++) { g.fillStyle = C.muted; g.textAlign = 'right'; g.fillText('|' + labels[i] + '⟩', x0 - 5, y0 + i * cs + cs / 2); g.textAlign = 'center'; if (Dm <= 8) { g.save(); g.translate(x0 + i * cs + cs / 2, y0 - 8); g.fillText('⟨' + labels[i] + '|', 0, 0); g.restore(); }
      for (let j = 0; j < Dm; j++) { const n = i * Dm + j, re = M.re[n], im = M.im[n]; g.fillStyle = cellColor(re, im, 0.5); g.fillRect(x0 + j * cs + 0.5, y0 + i * cs + 0.5, cs - 1, cs - 1);
        if (i === j) { g.strokeStyle = A(C.ink, 0.25); g.strokeRect(x0 + j * cs + 0.5, y0 + i * cs + 0.5, cs - 1, cs - 1); }
        if (cs >= 40 && Math.hypot(re, im) > 5e-4) { g.fillStyle = C.ink; g.fillText(cstr(re, im).replace(/ /g, ''), x0 + j * cs + cs / 2, y0 + i * cs + cs / 2); } } }
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'; cvD.style.height = (y0 + Dm * cs + 10) + 'px';
    cvD.onclick = e => { const b = cvD.getBoundingClientRect(), i = Math.floor((e.clientY - b.top - y0) / cs), j = Math.floor((e.clientX - b.left - x0) / cs); if (i >= 0 && j >= 0 && i < Dm && j < Dm) dmPick = [i, j]; };
    let txt = (dmPick && dmPick[0] < Dm && dmPick[1] < Dm ? `ρ(${labels[dmPick[0]]}, ${labels[dmPick[1]]}) = ${cstr(M.re[dmPick[0] * Dm + dmPick[1]], M.im[dmPick[0] * Dm + dmPick[1]])}   ·   ` : '');
    if (!anim || ++entTick % 6 === 0) { const ev = st.rho === 'full' ? eigH(S.R) : null; cacheEnt = { pur: st.rho === 'full' ? pur : (() => { let s2 = 0; for (let n = 0; n < 4; n++) s2 += M.re[n] ** 2 + M.im[n] ** 2; return s2; })(), S: ev ? H2(ev) : null,
      ent: [...Array(st.n).keys()].map(q => { const L = Math.hypot(...reduced(S.R, q).bloch); return H2([(1 + L) / 2, (1 - L) / 2]); }) }; }
    txt += tr('purity') + ' tr ρ² = ' + num(cacheEnt.pur, 3) + (cacheEnt.S !== null ? '   ·   ' + tr('entropy') + ' S(ρ) = ' + num(cacheEnt.S, 3) + ' ' + tr('bits') : '') + '   ·   ' + tr('entropy of each qubit') + ': ' + cacheEnt.ent.map((e, q) => 'q' + q + ' ' + num(e, 2)).join(', ');
    dmText.textContent = txt; }
  let dmPick = null, entTick = 0, cacheEnt = { pur: 1, S: 0, ent: [] };

  // ---------- frame ----------
  let time = 0;
  this.frame = function (dt) { time += dt;
    if (anim) { anim.t += dt / 1.1; if (anim.t >= 1) { finishAnim(); } }
    if (!anim && playing) { playT -= dt; if (playT <= 0) { if (k < ops.length) { startAnim(k, +1); playT = 1.25; } else playing = false; } }
    const S = anim ? animState() : shown;
    drawCircuit(); drawEquation(S); drawWheels(S, time); drawBloch(S); drawQ(S); drawTables(S, !anim); };

    const S = stateAt(ops.length); return { re: [...S.re], im: [...S.im], Rre: [...S.R.re], Rim: [...S.R.im], code: code() }; };
  settle();
}
let X = null;
X = new App();
toolbar();

let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; try { X.frame(dt); recordFrame(); } catch (e) { console.error(e); throw e; } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__sia_explore = { state: () => X, frame: dt => X.frame(dt || 0.016) };
})();
