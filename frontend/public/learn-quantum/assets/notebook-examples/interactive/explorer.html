<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDQS · HDQS</title>
<style>
:root{--bg:#fbfcfe;--panel:#fff;--ink:#172033;--muted:#5f6b7d;--grid:#e6ebf2;--ring:#c9d3df;--edge:#d7e0ea;
--accent:#2a78d6;--accent2:#eb6834;--neutral:#f0efec;--neg:#e34948;--hi:#fff4d6;
--g-single:#5b8def;--g-rot:#8b6de8;--g-ctrl:#ef9a4b;--g-meas:#22a783;--g-reset:#e26363;--g-custom:#d47bd6;--wire:#b8c3d1;color-scheme:light}
:root[data-theme="dark"]{--bg:#0d1424;--panel:#17243a;--ink:#f5f7fb;--muted:#9aa8bd;--grid:#26364f;--ring:#3b4f6d;--edge:#344966;
--accent:#3987e5;--accent2:#d95926;--neutral:#383835;--neg:#e66767;--hi:#2a3550;--wire:#50627b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;max-width:1280px;margin:0 auto}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button,select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.stepper{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--edge)}
.stepper .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepper input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.steplabel{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;min-width:220px}
.steplabel b{color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:12px 16px 40px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}.sph .cap span.rho2{display:inline-grid;grid-template-columns:auto auto;gap:1px 10px;margin-top:4px;font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--ink);border-left:1px solid var(--muted);border-right:1px solid var(--muted);padding:0 5px}.chg td{animation:flash 1.3s ease-out}@keyframes flash{from{background:var(--hi)}to{background:transparent}}.seg{display:inline-flex;gap:4px;margin:0 0 8px}.seg button{font-size:12px;padding:3px 8px}.entnote{font-size:12.5px;color:var(--ink);background:var(--hi);border-radius:8px;padding:6px 9px;margin-top:8px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{margin:0 0 2px;font-size:15px}
.card .note{color:var(--muted);font-size:12px;margin-bottom:8px}
.scroll{overflow-x:auto}
svg text{fill:var(--ink)}
.muted{fill:var(--muted)!important;color:var(--muted)}
canvas{display:block;margin:0 auto;touch-action:none;cursor:grab;max-width:100%}
.spheres{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.sph .cap{text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace}
.sph .cap span{display:block;color:var(--muted);font-family:system-ui,sans-serif}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;line-height:1.35;display:none;z-index:20;max-width:280px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{padding:4px 6px;border-bottom:1px solid var(--grid);text-align:right}
th:first-child,td:first-child{text-align:left}
.gate{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
footer{max-width:1280px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
@media (max-width:560px){h1{font-size:19px}.steplabel{min-width:0;width:100%}}
</style>
</head>

<script>
(function(){

const D=JSON.parse(document.getElementById('sia-data').textContent);
const N=D.num_qubits, DIM=1<<N, STEPS=D.steps, LAST=STEPS.length-1;
let step=LAST, playing=null, showTable=false;
const $=id=>document.getElementById(id);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ket=i=>'|'+i.toString(2).padStart(N,'0')+'⟩';
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;if(parent)parent.appendChild(e);return e;}
function oklch(L,C,hd){const h=hd*Math.PI/180,a=C*Math.cos(h),b=C*Math.sin(h);
 const l=Math.pow(L+0.3963377774*a+0.2158037573*b,3),m=Math.pow(L-0.1055613458*a-0.0638541728*b,3),s=Math.pow(L-0.0894841775*a-1.2914855480*b,3);
 const enc=x=>{x=Math.min(1,Math.max(0,x));return x<=0.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-0.055;};
 return [4.0767416621*l-3.3077115913*m+0.2309699292*s,-1.2684380046*l+2.6097574011*m-0.3413193965*s,-0.0041960863*l-0.7034186147*m+1.7076147010*s].map(enc);}
function phaseColor(phi){const dark=document.documentElement.dataset.theme==='dark';const hue=((262-phi*180/Math.PI)%360+360)%360;return 'rgb('+oklch(dark?0.72:0.62,0.125,hue).map(v=>Math.round(v*255)).join(',')+')';}
function piText(phi){const v=phi/Math.PI;if(Math.abs(v)<5e-4)return '0';for(const d of [1,2,4,3,6,8]){const n=v*d;if(Math.abs(n-Math.round(n))<5e-4){const k=Math.round(n),s=k<0?'-':'',a=Math.abs(k),t=a===1?'π':a+'π';return s+(d===1?t:t+'/'+d);}}return v.toFixed(2)+'π';}
const fmt=(x,d=3)=>(Math.abs(x)<5*Math.pow(10,-d-1)?0:x).toFixed(d);
function lerpColor(stops,t){t=Math.max(0,Math.min(1,t));const k=(stops.length-1)*t,i=Math.min(Math.floor(k),stops.length-2),f=k-i;const a=hex(stops[i]),b=hex(stops[i+1]);return 'rgb('+a.map((v,j)=>Math.round(v+(b[j]-v)*f)).join(',')+')';}
function hex(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function lum(c){const m=c.match(/\d+/g).map(Number);return (0.2126*m[0]+0.7152*m[1]+0.0722*m[2])/255;}
const SEQ={light:['#f4f8fd','#cde2fb','#86b6ef','#3987e5','#1c5cab','#0d366b'],dark:['#1b2a44','#184f95','#2a78d6','#5598e7','#9ec5f4']};
const SEQ2={light:['#fdf6f2','#fbd5c2','#f4a17c','#eb6834','#b4461b','#7a2c0f'],dark:['#2a2320','#7a3416','#d95926','#f08a5d','#f9c4a8']};
const DIV={light:['#e34948','#f0efec','#2a78d6'],dark:['#e66767','#383835','#3987e5']};
const SERIES={light:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'],dark:['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767']};
const themeName=()=>document.documentElement.dataset.theme==='dark'?'dark':'light';

// tooltip -------------------------------------------------------------------
const tip=$('tip');
function showTip(e,text){tip.textContent=text;tip.style.display='block';const x=(e.touches?e.touches[0].clientX:e.clientX),y=(e.touches?e.touches[0].clientY:e.clientY);const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(window.innerWidth-w-8,x+14)+'px';tip.style.top=Math.max(8,y-h-12)+'px';}
function hideTip(){tip.style.display='none';}
function hover(node,textFn){node.addEventListener('mousemove',e=>showTip(e,textFn()));node.addEventListener('mouseleave',hideTip);node.addEventListener('touchstart',e=>{showTip(e,textFn());setTimeout(hideTip,2200);},{passive:true});}

// layout --------------------------------------------------------------------
$('title').textContent=D.title;
$('subtitle').textContent=N+' qubit'+(N>1?'s':'')+' · '+D.circuit.length+' operations · qubit 0 is the leftmost bit · drag spheres to rotate';
$('foot').textContent='HDQS · Sia Software Innovations Private Limited. Works offline. Phase colour (equal brightness for every phase): 0 blue, π/2 teal, π amber, −π/2 rose; the clock hand points along the amplitude in the complex plane.';
const main=$('main');
function card(id,title,note,wide){const c=document.createElement('section');c.className='card'+(wide?' wide':'');c.id=id;c.innerHTML='<h2>'+title+'</h2><div class="note">'+note+'</div><div class="body"></div>';main.appendChild(c);return c.querySelector('.body');}
const V=D.views;
const body={};
body.c=card('c','Circuit','Click a gate to jump to the state right after it. Faded gates have not run yet.',true);
const ampView=V.includes('a')?'a':(V.includes('p')?'p':null);
if(ampView)body.a=card('a',ampView==='a'?'Amplitudes & phase':'Probabilities',ampView==='a'?'Bar height = |amplitude|; colour and clock hand = phase. Hover a bar for exact values.':'Exact outcome probabilities. Hover a bar for exact values.',true);
if(V.includes('b'))body.b=card('b','Bloch spheres','Each qubit alone. A shorter arrow means the qubit is entangled or mixed. Drag to rotate.',false);
if(V.includes('q'))body.q=card('q','Q-sphere','Basis states by number of 1s (top: all 0, bottom: all 1); dot size = probability, colour = phase. Drag to rotate.',false);
if(V.includes('e')&&STEPS[0].mutual_information)body.e=card('e','Entanglement map','Left: mutual information I(i:j) in bits (diagonal: entropy of each qubit with the rest). Right: concurrence. Watch it change as you step.',true);
if(V.includes('d')&&STEPS[0].rho_real)body.d=card('d','Density matrix','Choose |ρ| & phase (one grid, same colours as the amplitudes) or real & imaginary parts. Hover a cell for its value.',true);
if(V.includes('i')&&D.cria)body.i=card('i','Interference accessibility (CRIA)','Final state. Coherence of each target recoverable by measuring r helper qubits; best helper set on hover.',false);
if(V.includes('h')&&D.counts)body.h=card('h','Measured counts','Final state, '+D.counts.shots+' shots, ±1σ error bars; diamonds = exact probability.',false);
const X=(()=>{const e=document.getElementById('sia-extra');return e?JSON.parse(e.textContent):{};})();
if(V.includes('u')&&X.operators)body.u=card('u','This step as a matrix','U · |ψ⟩ = |ψ′⟩ for the gate just applied. Colour = phase, strength = magnitude. Tap an output to see how it is built.',true);
if(V.includes('v'))body.v=card('v','State vector','Exact amplitudes at this step; rows that just changed flash.',false);
if(V.includes('t'))body.t=card('t','Timeline','Entropy of each qubit and purity of the register after every step. Tap to jump.',false);
const tableBox=document.createElement('div');tableBox.className='scroll';tableBox.style.display='none';
if(body.a)body.a.parentNode.appendChild(tableBox);

// circuit -------------------------------------------------------------------
const GC={h:'single',x:'single',y:'single',z:'single',s:'single',sdg:'single',t:'single',tdg:'single',rx:'rot',ry:'rot',rz:'rot',p:'rot',u3:'rot',measure:'meas',reset:'reset',unitary:'custom',kraus:'custom'};
let circSvg=null,colNodes=[];
function drawCircuit(){
 const ops=D.circuit,cw=58,rh=48,left=56,top=26;
 const W=left+Math.max(ops.length,1)*cw+30,H=top+N*rh+18;
 body.c.innerHTML='';const wrap=document.createElement('div');wrap.className='scroll';body.c.appendChild(wrap);
 const svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:W,height:H,role:'img','aria-label':'circuit diagram'},wrap);circSvg=svg;
 const y=q=>top+q*rh+rh/2;
 for(let q=0;q<N;q++){el('line',{x1:left-6,x2:W-12,y1:y(q),y2:y(q),stroke:css('--wire'),'stroke-width':1.6},svg);el('text',{x:8,y:y(q)+4,'font-size':12,'font-weight':600},svg,'q'+q);}
 colNodes=[];
 ops.forEach((op,i)=>{
  const g=el('g',{class:'gate'},svg);colNodes.push(g);const x=left+i*cw+cw/2;
  el('rect',{x:x-cw/2+2,y:4,width:cw-4,height:H-8,rx:8,fill:'transparent',class:'colbg'},g);
  el('text',{x:x,y:15,'text-anchor':'middle','font-size':9,class:'muted'},g,String(i+1).padStart(2,'0'));
  const qs=op.qubits,nm=op.name,ctl=css('--g-ctrl');
  const box=(q,label,kind,sub)=>{const c=css('--g-'+(kind||'single'));el('rect',{x:x-19,y:y(q)-16,width:38,height:32,rx:7,fill:c},g);el('text',{x:x,y:y(q)+(sub?0:4),'text-anchor':'middle','font-size':label.length>2?10:12,'font-weight':700,style:'fill:#fff'},g,label);if(sub)el('text',{x:x,y:y(q)+11,'text-anchor':'middle','font-size':8,style:'fill:#fff;opacity:.85'},g,sub);};
  const dot=q=>el('circle',{cx:x,cy:y(q),r:5.5,fill:ctl},g);
  const plus=q=>{el('circle',{cx:x,cy:y(q),r:11,fill:css('--panel'),stroke:ctl,'stroke-width':2},g);el('line',{x1:x-11,x2:x+11,y1:y(q),y2:y(q),stroke:ctl,'stroke-width':2},g);el('line',{x1:x,x2:x,y1:y(q)-11,y2:y(q)+11,stroke:ctl,'stroke-width':2},g);};
  const cross=q=>{for(const s of [1,-1])el('line',{x1:x-8,x2:x+8,y1:y(q)-8*s,y2:y(q)+8*s,stroke:ctl,'stroke-width':2.4},g);};
  const link=()=>{if(qs.length>1)el('line',{x1:x,x2:x,y1:y(Math.min(...qs)),y2:y(Math.max(...qs)),stroke:ctl,'stroke-width':2},g);};
  const par=op.params&&op.params.length?op.params.map(v=>(+v).toFixed(2)).join(','):'';
  if(nm==='cx'||nm==='ccx'||nm==='mcx'){link();qs.slice(0,-1).forEach(dot);plus(qs[qs.length-1]);}
  else if(nm==='cz'){link();qs.forEach(dot);}
  else if(nm==='swap'){link();qs.forEach(cross);}
  else if(nm==='cswap'){link();dot(qs[0]);cross(qs[1]);cross(qs[2]);}
  else if(['cy','cp','crx','cry','crz'].includes(nm)){link();dot(qs[0]);box(qs[1],{cy:'Y',cp:'P',crx:'RX',cry:'RY',crz:'RZ'}[nm],'ctrl',par);}
  else if(nm==='barrier'){el('line',{x1:x,x2:x,y1:top,y2:top+N*rh,stroke:css('--muted'),'stroke-dasharray':'4 4','stroke-width':1.5},g);}
  else if(nm==='measure'){qs.forEach(q=>box(q,'M','meas',op.key?'→'+op.key:''));}
  else if(nm==='reset'){qs.forEach(q=>box(q,'|0⟩','reset'));}
  else if(nm==='kraus'){qs.forEach(q=>box(q,'N','custom','noise'));}
  else{const lab=({unitary:'U',initialize:'init',kraus:'N',u3:'U3'})[nm]||nm.toUpperCase().replace('SDG','S†').replace('TDG','T†');if(qs.length===1)box(qs[0],lab,GC[nm]||'custom',par);else{link();qs.forEach(q=>box(q,lab,'custom'));}}
  if(op.condition){el('text',{x:x,y:y(Math.max(...qs))+30,'text-anchor':'middle','font-size':9,class:'muted'},g,'if '+op.condition[0]+'='+op.condition[1]);}
  hover(g,()=>'Step '+(i+1)+': '+op.label+'\nclick to jump here');
  g.addEventListener('click',()=>setStep(i+1));

}
function highlightCircuit(){colNodes.forEach((g,i)=>{g.style.opacity=i<step?1:0.28;g.querySelector('.colbg').setAttribute('fill',i===step-1?css('--hi'):'transparent');});

function drawCounts(){const C=D.counts,k=C.labels.length,W=Math.max((body.h.clientWidth||420),k*30+60),H=250,l=44,t=14,b=k>8?56:30,pw=W-l-10,ph=H-t-b,bw=pw/k,vmax=niceMax(Math.max(.05,...C.frequency,...C.exact)*1.08);body.h.innerHTML='';
 const wrap=document.createElement('div');wrap.className='scroll';body.h.appendChild(wrap);const svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:W,height:H},wrap);
 for(let g=0;g<=4;g++){const yy=t+ph-ph*g/4;el('line',{x1:l,x2:W-10,y1:yy,y2:yy,stroke:css('--grid')},svg);el('text',{x:l-6,y:yy+4,'text-anchor':'end','font-size':10,class:'muted'},svg,(vmax*g/4).toFixed(2));}
 C.labels.forEach((lab,j)=>{const f=C.frequency[j],e=C.exact[j],se=C.std_error[j],x=l+j*bw+bw*.14,w=bw*.72,Y=v=>t+ph-ph*v/vmax,g=el('g',{},svg);
  el('rect',{x:x,y:Y(f),width:w,height:Math.max(0.001,ph*f/vmax),rx:2,fill:css('--accent')},g);el('rect',{x:l+j*bw,y:t,width:bw,height:ph,fill:'transparent'},g);
  if(f>0)el('line',{x1:x+w/2,x2:x+w/2,y1:Y(f-se),y2:Y(f+se),stroke:css('--ink'),'stroke-width':1.2},g);
  if(e>1e-12||f>0)el('path',{d:'M'+(x+w/2)+','+(Y(e)-5)+' l5,5 l-5,5 l-5,-5z',fill:css('--accent2'),stroke:css('--panel')},g);
  const lx=x+w/2,ly=t+ph+12;el('text',{x:lx,y:ly,'font-size':10,'text-anchor':k>8?'end':'middle',transform:k>8?'rotate(-55 '+lx+' '+ly+')':''},g,lab);
  hover(g,()=>lab+'\ncount '+C.count[j]+' of '+C.shots+'\nfrequency '+f.toFixed(4)+' ± '+se.toFixed(4)+'\nexact '+e.toFixed(4));});}

// stepping ------------------------------------------------------------------------
const slider=$('slider');slider.max=LAST;
let VIEWST=null,animReq=null;
function blend(a,b,f){if(typeof a==='number'&&typeof b==='number')return a+(b-a)*f;if(Array.isArray(a)&&Array.isArray(b)&&a.length===b.length)return a.map((v,i)=>blend(v,b[i],f));if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)){const o={};for(const k in b)o[k]=k in a?blend(a[k],b[k],f):b[k];return o;}return f<0.5?a:b;}
function setStep(s){const to=Math.max(0,Math.min(LAST,s)),from=step;step=to;slider.value=step;if(animReq){cancelAnimationFrame(animReq);animReq=null;VIEWST=null;}if(Math.abs(to-from)===1&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const A=STEPS[from],B=STEPS[to],t0=performance.now(),dur=480;const tick=now=>{const u=Math.min(1,(now-t0)/dur),f=u<.5?2*u*u:1-2*(1-u)*(1-u);VIEWST=u<1?blend(A,B,f):null;if(VIEWST){VIEWST.label=B.label;VIEWST.records=B.records;}render();if(u<1)animReq=requestAnimationFrame(tick);else animReq=null;};animReq=requestAnimationFrame(tick);return;}render();}
function render(){const st=STEPS[step];$('stepLabel').innerHTML='Step <b>'+step+'</b> / '+LAST+' · '+st.label.replace(/</g,'&lt;')+(Object.keys(st.records).length?' · '+Object.entries(st.records).map(([k,v])=>k+'='+v).join(', '):'');
 highlightCircuit();if(body.a)drawAmps();draw3D();if(body.e)drawEnt();if(body.d)drawDensity();if(body.v)drawVector();if(body.u)drawOperator();if(body.t)drawTimeline();}

// exact numbers (1/√2, √3/2, i/2 …) ------------------------------------------------
const NICE=[[1,'1'],[.5,'1/2'],[Math.SQRT1_2,'1/√2'],[Math.sqrt(3)/2,'√3/2'],[.25,'1/4'],[.75,'3/4'],[1/Math.sqrt(3),'1/√3'],[Math.sqrt(2/3),'√(2/3)'],[1/(2*Math.SQRT2),'1/(2√2)']];
function xnum(x){const a=Math.abs(x);if(a<5e-4)return '0';const s=x<0?'−':'';for(const [v,t] of NICE)if(Math.abs(a-v)<5e-4)return s+t;return s+a.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');}
function xc(re,im){const a=Math.abs(re)<5e-4?0:re,b=Math.abs(im)<5e-4?0:im;if(b===0)return xnum(a);const nb=xnum(Math.abs(b)),ib=Math.abs(Math.abs(b)-1)<5e-4?'i':(nb.includes('/')?(nb.split('/')[0]==='1'?'i':nb.split('/')[0]+'i')+'/'+nb.split('/').slice(1).join('/'):nb+'i');if(a===0)return (b<0?'−':'')+ib;return xnum(a)+(b<0?' − ':' + ')+ib;}
let prevVec=null;
function drawVector(){const st=VIEWST||STEPS[step];if(!st.real){body.v.innerHTML='<div class="note">Mixed state at this step: no single state vector. Probabilities: '+st.probability.map((p,i)=>ket(i)+' '+fmt(p,3)).filter((_,i)=>st.probability[i]>1e-6).join(', ')+'</div>';return;}
 const idx=indicesFor(st);let h='<div class="scroll"><table><thead><tr><th>basis</th><th>amplitude</th><th>probability</th><th>phase</th></tr></thead><tbody>';
 idx.forEach(i=>{const re=st.real[i],im=st.imag[i],m=Math.hypot(re,im),chg=!VIEWST&&prevVec&&prevVec.step!==step&&(Math.abs(prevVec.re[i]-re)>1e-6||Math.abs(prevVec.im[i]-im)>1e-6);
  h+='<tr'+(chg?' class="chg"':'')+'><td>'+ket(i)+'</td><td>'+(m<5e-4?'0':xc(re,im))+'</td><td>'+xnum(m*m)+'</td><td>'+(m<5e-4?'—':piText(Math.atan2(im,re)))+'</td></tr>';});
 body.v.innerHTML=h+'</tbody></table></div>';if(!VIEWST)prevVec={step:step,re:st.real.slice(),im:st.imag.slice()};}
let opRow=-1;
function drawOperator(){const M=X.operators[step-1],st=STEPS[step],pre=STEPS[step-1];body.u.innerHTML='';
 if(!step){body.u.innerHTML='<div class="note">Start |0…0⟩. Step forward to see the first gate as a matrix.</div>';return;}
 if(M==='barrier'){body.u.innerHTML='<div class="note">Barrier: no operation.</div>';return;}
 if(!M){body.u.innerHTML='<div class="note">'+st.label+' is not a single matrix acting on |ψ⟩ (measurement, reset or noise). Watch the density matrix and the probabilities instead.</div>';return;}
 if(!pre.real||!st.real){body.u.innerHTML='<div class="note">The state is mixed here; see the density matrix.</div>';return;}
 const dim=M.re.length,cs=Math.max(14,Math.min(52,Math.floor(Math.min(420,(body.u.clientWidth||700)*0.55)/dim))),l=dim>8?44:40,t=22,W=l+cs*dim+cs*2+90,H=t+cs*dim+8,txt=cs>=40;
 let r=opRow;if(r<0||r>=dim){let best=-1,bv=1e-9,cancel=-1,big=0,bm=-1;for(let i=0;i<dim;i++){const d=Math.hypot(st.real[i]-pre.real[i],st.imag[i]-pre.imag[i]),m=Math.hypot(st.real[i],st.imag[i]);let nz=0;for(let j=0;j<dim;j++)if(Math.hypot(M.re[i][j],M.im[i][j])>1e-9&&Math.hypot(pre.real[j],pre.imag[j])>1e-9)nz++;if(nz>1&&m<1e-6&&cancel<0)cancel=i;if(m>1e-9&&d>bv){bv=d;best=i;}if(m>bm){bm=m;big=i;}}r=cancel>=0?cancel:(best>=0?best:big);}
 const wrap=document.createElement('div');wrap.className='scroll';body.u.appendChild(wrap);const svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:W,height:H},wrap);
 const cell=(x,y,re,im,g)=>{const m=Math.hypot(re,im);el('rect',{x:x+.5,y:y+.5,width:cs-1,height:cs-1,fill:m<1e-9?css('--panel'):phaseColor(Math.atan2(im,re)),'fill-opacity':m<1e-9?1:(0.15+0.85*Math.pow(Math.min(1,m),0.6)).toFixed(3),stroke:css('--grid')},g);
  if(txt&&m>5e-4){const s=xc(re,im).replace(/ /g,'');if(s.length<=6)el('text',{x:x+cs/2,y:y+cs/2+4,'text-anchor':'middle','font-size':cs>=48?11:9},g,s);}};
 for(let i=0;i<dim;i++){el('text',{x:l-5,y:t+i*cs+cs/2+4,'text-anchor':'end','font-size':dim>8?8:10,class:i===r?'':'muted'},svg,ket(i));for(let j=0;j<dim;j++)cell(l+j*cs,t+i*cs,M.re[i][j],M.im[i][j],svg);}
 el('rect',{x:l,y:t+r*cs,width:cs*dim,height:cs,fill:'none',stroke:css('--accent2'),'stroke-width':2},svg);
 const xv=l+cs*dim+22,xw=xv+cs+30;el('text',{x:l+cs*dim/2,y:14,'text-anchor':'middle','font-size':11,class:'muted'},svg,'U');el('text',{x:xv+cs/2,y:14,'text-anchor':'middle','font-size':11,class:'muted'},svg,'|ψ⟩');el('text',{x:xw+cs/2,y:14,'text-anchor':'middle','font-size':11,class:'muted'},svg,'|ψ′⟩');
 for(let i=0;i<dim;i++){cell(xv,t+i*cs,pre.real[i],pre.imag[i],svg);const g=el('g',{style:'cursor:pointer'},svg);cell(xw,t+i*cs,st.real[i],st.imag[i],g);g.addEventListener('click',()=>{opRow=i;drawOperator();});
  if(Math.hypot(M.re[r][i],M.im[r][i])>1e-9&&Math.hypot(pre.real[i],pre.imag[i])>1e-9)el('rect',{x:xv+1,y:t+i*cs+1,width:cs-2,height:cs-2,fill:'none',stroke:css('--accent2'),'stroke-width':2},svg);}
 el('rect',{x:xw+1,y:t+r*cs+1,width:cs-2,height:cs-2,fill:'none',stroke:css('--accent2'),'stroke-width':2},svg);
 el('text',{x:xv-12,y:t+cs*dim/2+5,'font-size':18,'text-anchor':'middle'},svg,'·');el('text',{x:xw-14,y:t+cs*dim/2+5,'font-size':16,'text-anchor':'middle'},svg,'=');
 const terms=[];let sr=0,si=0;for(let j=0;j<dim;j++){const ur=M.re[r][j],ui=M.im[r][j],pr=pre.real[j],pi_=pre.imag[j];if(Math.hypot(ur,ui)<1e-9||Math.hypot(pr,pi_)<1e-9)continue;sr+=ur*pr-ui*pi_;si+=ur*pi_+ui*pr;terms.push('('+xc(ur,ui)+')('+xc(pr,pi_)+')');}
 const p=document.createElement('div');p.className='note';p.style.marginTop='6px';p.textContent='ψ′('+ket(r).slice(1,-1)+') = '+(terms.join(' + ')||'0')+' = '+xc(sr,si)+(terms.length>1&&Math.hypot(sr,si)<1e-6?'  ← the contributions cancel':'');body.u.appendChild(p);}
function drawTimeline(){const k=STEPS.length,W=Math.max(300,Math.min(640,body.t.clientWidth||460)),H=230,l=40,t=12,b=36,pw=W-l-12,ph=H-t-b,tn=themeName();body.t.innerHTML='';
 const svg=el('svg',{viewBox:'0 0 '+W+' '+H,width:W,height:H},body.t);const Xs=i=>l+pw*(k>1?i/(k-1):0.5),Ys=v=>t+ph*(1-v);
 for(let g=0;g<=4;g++){el('line',{x1:l,x2:l+pw,y1:Ys(g/4),y2:Ys(g/4),stroke:css('--grid')},svg);el('text',{x:l-6,y:Ys(g/4)+4,'text-anchor':'end','font-size':10,class:'muted'},svg,(g/4).toFixed(2));}
 const pur=STEPS.map(s=>s.rho_real?s.rho_real.reduce((a,r,i)=>a+r.reduce((b,v,j)=>b+v*v+s.rho_imag[i][j]*s.rho_imag[i][j],0),0):(s.real?1:null));
 for(let q=0;q<N;q++){const ys=STEPS.map(s=>s.entropy?s.entropy[q]:1-s.bloch[q].length);el('polyline',{points:ys.map((v,i)=>Xs(i)+','+Ys(Math.min(1,v))).join(' '),fill:'none',stroke:SERIES[tn][q%8],'stroke-width':2},svg);}
 if(pur.every(v=>v!==null))el('polyline',{points:pur.map((v,i)=>Xs(i)+','+Ys(v)).join(' '),fill:'none',stroke:css('--ink'),'stroke-width':1.5,'stroke-dasharray':'5 4'},svg);
 el('line',{x1:Xs(step),x2:Xs(step),y1:t,y2:t+ph,stroke:css('--muted'),'stroke-width':1.5,'stroke-dasharray':'2 3'},svg);el('text',{x:Xs(step),y:t+8,'text-anchor':'middle','font-size':9,class:'muted'},svg,'now');
 for(let i=0;i<k;i++){const r=el('rect',{x:Xs(i)-pw/(2*Math.max(1,k-1)),y:t,width:pw/Math.max(1,k-1),height:ph,fill:'transparent',style:'cursor:pointer'},svg);r.addEventListener('click',()=>setStep(i));}
 el('text',{x:l,y:H-8,'font-size':10,class:'muted'},svg,'step 0');el('text',{x:l+pw,y:H-8,'font-size':10,'text-anchor':'end',class:'muted'},svg,'step '+(k-1));
 const lg=document.createElement('div');lg.className='legend';lg.innerHTML=[...Array(N).keys()].map(q=>'<span><i class="sw" style="background:'+SERIES[tn][q%8]+'"></i>q'+q+' entropy</span>').join('')+'<span>- - purity</span>';body.t.appendChild(lg);}

slider.addEventListener('input',()=>setStep(+slider.value));
$('first').onclick=()=>setStep(0);$('last').onclick=()=>setStep(LAST);$('prev').onclick=()=>setStep(step-1);$('next').onclick=()=>setStep(step+1);
function togglePlay(){if(playing){clearInterval(playing);playing=null;$('play').textContent='▶ Play';return;}if(step>=LAST)setStep(0);$('play').textContent='❚❚ Pause';playing=setInterval(()=>{if(step>=LAST){togglePlay();return;}setStep(step+1);},900);}
$('play').onclick=togglePlay;
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;const k=e.key;
 if(k==='ArrowRight'){setStep(step+1);}else if(k==='ArrowLeft'){setStep(step-1);}else if(k==='Home'){setStep(0);}else if(k==='End'){setStep(LAST);}else if(k===' '){togglePlay();}else return;e.preventDefault();});
$('themeBtn').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';drawCircuit();if(body.i)drawCria();if(body.h)drawCounts();render();};
$('tableBtn').onclick=()=>{showTable=!showTable;$('tableBtn').setAttribute('aria-pressed',showTable);render();};
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
$('jsonBtn').onclick=()=>download('hdqs_data.json',JSON.stringify(D,null,1),'application/json');
$('csvBtn').onclick=()=>{const st=STEPS[step];let s='step,operation,basis_state,real,imag,probability\n';st.probability.forEach((p,i)=>{s+=step+',"'+st.label+'",'+ket(i)+','+(st.real?st.real[i]:'')+','+(st.imag?st.imag[i]:'')+','+p+'\n';});download('hdqs_step'+step+'.csv',s,'text/csv');};
window.addEventListener('resize',()=>{clearTimeout(window.__r);window.__r=setTimeout(()=>{if(body.i)drawCria();if(body.h)drawCounts();render();},120);});
drawCircuit();if(body.i)drawCria();if(body.h)drawCounts();render();
})();
</script>
