    gg.strokeStyle = C.grid; gg.lineWidth = 1; gg.beginPath(); gg.moveTo(mx, H / 2); gg.lineTo(W - 10, H / 2); gg.stroke();
    gg.fillStyle = C.muted; gg.font = '11px system-ui,sans-serif'; gg.fillText(num(wa, 2), 4, my + 4); gg.fillText('−' + num(wa, 2), 4, H - my + 4); gg.fillText(tr('now'), W - 34, H - 4);

    if (ser) { const S = SHAPES[st.shape]; gg.strokeStyle = A(C.muted, 0.5); gg.setLineDash([2, 4]); [1, -1].forEach(v => { gg.beginPath(); gg.moveTo(mx, ty(v * st.A1)); gg.lineTo(W - 10, ty(v * st.A1)); gg.stroke(); }); gg.setLineDash([]);
      trace(tt => st.A1 * S.f(st.w1 * tt + st.p1), A(C.ink, 0.55), 1.4, [6, 4], 900); trace(tt => zAt(tt)[1], C.c2, 2.2, null, 700); }
    else { trace(tt => zAt(tt)[0], C.c1, 2); trace(tt => zAt(tt)[1], C.c2, 2);

    gg.strokeStyle = C.muted; gg.beginPath(); gg.moveTo(tx(t), my); gg.lineTo(tx(t), H - my); gg.stroke(); gg.fillStyle = C.c2; gg.beginPath(); gg.arc(tx(t), ty(z[1]), 4, 0, TAU); gg.fill();
    gg.font = '12px system-ui,sans-serif';
    if (ser) { gg.fillStyle = C.c2; gg.fillText(tr('Im z: sum of') + ' ' + TM.length + ' ' + tr('phasors'), mx + 6, 13); gg.fillStyle = C.muted; gg.fillText('- - ' + tr(SHAPES[st.shape].name), mx + 170, 13); }
    else { gg.fillStyle = C.c1; gg.fillText('Re z', mx + 6, 13); gg.fillStyle = C.c2; gg.fillText('Im z', mx + 50, 13); if (many) { gg.fillStyle = C.c4; gg.fillText(tr('|z| envelope'), mx + 94, 13); } }
    // readout

    R.innerHTML = '';

    if (ser) { const S = SHAPES[st.shape]; let mx2 = 0, err = 0; const M = 1200; for (let i = 0; i < M; i++) { const th = i / M * TAU, tt = (th - st.p1) / st.w1, v = zAt(tt)[1]; mx2 = Math.max(mx2, v); const d = v - st.A1 * S.f(th); err += d * d; }
      line('f(t) =', 'A·' + S.law, true); line('phasors used', TM.length + '  (' + tr('highest harmonic') + ' k = ' + Math.round(TM[TM.length - 1][1] / st.w1) + ')');
      line('largest |b_k|', num(TM[0][0], 3) + ',  ' + tr('smallest') + ' ' + num(TM[TM.length - 1][0], 3));
      line('rms error', num(Math.sqrt(err / M) / st.A1, 3) + ' × A');

    line('z =', cstr(z[0], z[1]), true); line('|z| =', num(mod, 3)); line('arg z =', ang(Math.atan2(z[1], z[0])));

  };
}
