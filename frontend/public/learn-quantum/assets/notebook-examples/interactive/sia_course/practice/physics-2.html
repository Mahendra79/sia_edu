.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}

.hint{color:var(--muted);font-size:13px}
.key{display:none}

 .ans input{border:0;border-bottom:1px solid #999;border-radius:0}.key{display:block;break-before:page}body{background:#fff;color:#000}}

    const bank = el('div', 'bank'); D.match.options.forEach(t => bank.appendChild(el('span', '', t))); card.appendChild(bank);
    const mrows = D.problems.filter(P => P.mode === 'match'), sts = [];
    mrows.forEach((P, r) => {
      const row = el('div', 'mrow'); row.appendChild(el('span', 'num', P.n + '.'));
      const body = el('div'); body.appendChild(document.createTextNode(P.prompt));
      if (P.given.length) { const g = el('div', 'given'); P.given.forEach(x => g.appendChild(givenBlock(x))); body.appendChild(g); }
      row.appendChild(body);
      const pick = el('div', 'pick'), sel = el('select');
      const o0 = el('option', '', U.choose); o0.value = ''; sel.appendChild(o0);
      D.match.options.forEach((t, j) => { const o = el('option', '', t); o.value = 'o' + j; sel.appendChild(o); });
      const mk = el('span', 'mk'); pick.appendChild(sel); pick.appendChild(mk); row.appendChild(pick);
      const det = el('details'); det.style.gridColumn = '2'; det.appendChild(el('summary', '', U.solution)); const pre = el('div', 'steps');
      pre.textContent = P.steps.join('\n') + '\n→ ' + U.answer + ': ' + P.answer_text; det.appendChild(pre); row.appendChild(det);
      const st = { done: false, sel, mk, want: D.match.correct[r] }; sts.push(st); state.push(st);
      card.appendChild(row);
    });
    const go = el('button', 'primary', U.check); go.type = 'button';
    go.onclick = () => { sts.forEach(st => { if (st.sel.value === '') { st.mk.textContent = ''; return; } const ok = st.sel.value === 'o' + st.want; st.mk.className = 'mk ' + (ok ? 'ok' : 'no'); st.mk.textContent = ok ? '✓' : '✗ ' + U.wrong; st.done = st.done || ok; }); score(); };
    const a = el('div', 'ans'); a.appendChild(go); card.appendChild(a);
    list.appendChild(card);
  }
  const key = $('key'); key.innerHTML = ''; key.appendChild(el('h2', '', U.answers));
  D.problems.forEach(P => key.appendChild(el('div', '', P.n + '. ' + P.answer_text)));
  score();
}
function score() {
  const done = state.filter(s => s.done).length;
  $('score').textContent = U.score + ': ' + done + ' / ' + state.length;
  if (D.progress) {   // part of a course: remember the best score for the course index
    try {
      const k = 'sia-progress:' + D.progress, old = JSON.parse(localStorage.getItem(k) || '{}');
      if (!(old.done >= done)) localStorage.setItem(k, JSON.stringify({ done: done, total: state.length }));
    } catch (e) { /* storage blocked: the page still works */ }
  }
}
if (D.back) { const a = el('a', 'back', D.back_label || '←'); a.href = D.back; $('title').before(a); }
let open = false;
$('all').onclick = () => { open = !open; document.querySelectorAll('details').forEach(d => d.open = open); $('all').textContent = open ? U.hide_all : U.show_all; };
$('reset').onclick = render; $('print').onclick = () => window.print();
$('theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; };
render();
})();
</script></body></html>
